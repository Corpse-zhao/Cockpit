name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cockpit.xcodeproj \
            -scheme Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **BMS 连上收不到数据：补三条自愈 + 一眼能看出卡在哪**

            - 写入模式原来只会用「免应答写」：有的保护板只认带响应的写，就会一直
              收不到回应。现在还没出帧时两种写模式轮流试
            - FFE0 底下一条特征值都没有时（个别固件把数据挂别的服务），会枚举全部
              服务的特征值，不再停在「连上但没通道」
            - 连上 10 秒仍是零字节：先全量枚举补一次，还不行就断链重连一次
              （有的模块只在新建连接上推数据）
            - 订阅失败不再静默，直接显示错误原文
            - BMS 页面新增诊断行：`已发 N 帧 · 收到 M 字节 · 通道`，
              发 0 帧 = 没找到可写通道，发了很多帧但 0 字节 = 板子不认这个请求

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
