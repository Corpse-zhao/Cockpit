name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cockpit.xcodeproj \
            -scheme Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            Cockpit v${{ steps.ver.outputs.version }}

            **BMS 列表：认不出保护板时不再给你一个空列表**

            - 「仅保护板」过滤一个都命中时，自动退回显示全部蓝牙（按钮会写「全部蓝牙（自动）」），
              不用再自己翻开关——换过固件/广播名被截断的保护板就属于这种情况
            - 扫描看门狗：界面上写着「正在搜索」但系统其实没在扫（App 从后台回来常见），
              8 秒零设备就自动补扫一次

            **扫描修复：广播包不带名字的控制器现在能被看到**

            - YuanQuFOC972 的广播包有时不含设备名，之前只认广播名，
              结果「控制器开着机、App 却扫不到」。现在广播里带 FFE0/FFF0
              服务的设备一律视为已知控制器，直接进列表
            - 「显示所有蓝牙设备」默认改为开启（认得出的排前面），
              第一次用不用再进设置翻开关

            **同时本项目开源**：MIT License。

            **本版针对「YuanQuFOC972」实测修正**

            - 广播名 `YuanQuFOC972`（远驱 = YuanQu）现在是已知品牌：
              扫描列表能直接看到、并自动把型号填成「远驱 FOC972」，
              不用再开「显示所有蓝牙设备」
            - 修掉一处会吃掉全部通知的绑定错误：这类设备有两组服务
              （FFE0/FFEC 实时 + FFF6/FFF7 配置），原来后枚举到的 FFF7
              会把已绑定的 FFEC 顶掉，结果「订阅的是 FFEC、比对的是 FFF7」，
              一帧都进不来。现在只在没有通知通道时才采纳自动探测结果
            - FFE0 里没有 FFE1 时，日志会明确打印改用了哪个特征订阅

            **没变的**：凌博链路、BMS、仪表、设置页逻辑零改动。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
