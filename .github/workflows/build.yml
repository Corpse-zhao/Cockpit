name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **新增第三套仪表：粉黑（参考车机 HUD 重画）**

            - 顶部一条很浅的椭圆弧，132 根刻度按车速点亮，右侧 0.5 之后是红区；
              0–9 刻度数字浮在刻度上方，当前档位那颗放大变亮
            - 弧线上罩着一条白色「罩形线」，沿刻度底走、收在 NOS；右段红线下垂收尾
            - 中央是粉光核心：三层六边形反向旋转、12 根辐条、14 颗轨道粒子，
              车速越快转得越快越亮，猛加速时整体胀一下
            - 左下 PINK ⚑ OVERBOOST. 标；中间 DASHBOARD 菜单（Time / Trip 是真实数据）
            - 右侧大号功率 W、GEAR 档位（有档位就读档位，没有就显示 F/N）
            - 底栏 F/R 胎压（读设置里的胎压）与控制器 / 电机温度、SOC 分段条、
              车速、ODO 总里程（从这版开始累计）

            **动效**

            车速差分出加速度驱动冲击能量 E：整屏轻微抖动 + 推近 0.12% + 粉色屏闪，
            比红黑克制一档——粉黑这套是「安静地跑」，不是「炸屏」。

            **设置里现在三套**：霓虹（默认，叠壁纸）、红黑（斜梯巨字、整屏冲击）、
            粉黑（顶弧刻度 + 粉光核心）。切换即时生效，不用重连。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
