name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **新增：五套仪表样式（设置 → 外观 → 仪表样式，切换即时生效）**

            - **霓虹**：圆盘 + 发光进度弧（原来的那套）
            - **赛道**：去掉圆盘，超大斜体数字 + 速度横条，右半屏五行「数值 + 进度条」
            - **液态**：左侧竖罐，液面高度 = 车速 / 满量程，波纹滚动速度跟着车速走
            - **示波**：车速画成一条 6.4 秒的实时波形，虚线是均值，右端亮点是当前值
            - **轨道**：中央细体大字，一颗星按车速公转（静止约 7 秒一圈，满速约 2 秒）

            主题色对五套全部生效：进度弧、液面、波形、轨道、横条都取主题色；
            绿/橙/红只留给状态语义（正常 / 警告 / 故障），不随主题变。
            五套都支持壁纸，铺满 / 完整显示两种填充方式照旧。

            **数据面板（霓虹样式）**

            - 四层：上两层控制器、下两层电池（蚂蚁板 BMS）
            - 第一排：母线电压 / 母线电流 / 功率(W) / 控制器温度
            - 第二排：相电流（设置里可换成电机温度）/ 转速 / 定位精度 / 故障码
            - 电池：电量 / 总压 / 电流 / 功率 · 压差 / 温度 / 剩余容量 / SOH

            **连接**

            - 控制器与 BMS 都记住上次那台，进页面自动直连
            - BMS 记住跑通的写入通道，重连免摸索；断流先换通道再断链重建
            - 仪表页「电池未连接」可直接点开连接面板，不用绕去设置

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
