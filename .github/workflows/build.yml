name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **修：空转时电池数据不动（根因是追问太快，把帧截断了）**

            蚂蚁板一帧状态 152 字节，MTU 20 时要拆成七八条通知慢慢吐。
            我们原来固定 400ms 追问一次——上一帧还没吐完就发下一帧，模块直接放弃，
            拼出来的永远是残帧、CRC 必然对不上，于是数据停在连上那一瞬间，直到下次重连。

            现在改成「等应答再发」：请求出去后，收到完整一帧才发下一次，最多等 1.2 秒兜底。
            节奏跟着模块走：吐得快就快，吐得慢就慢，不会再截断。

            **新增：链路自检（电池详情页）**

            - 「收到 N 条 / 解析 M 帧 / 最后一帧 x.x 秒前」
            - 「最近帧 02·152 02·152 02·20」——直接看模块回的是什么长度
            - 条数在涨、解析数不动 = 拼不出来；两个都不动 = 真断流，一眼能分清

            **修：电池页「告警 有」误报**

            蚂蚁协议只定义了 bit0–15，高位各固件写法不一样，这块板高位有置位。
            现在按位翻译：单体过压告警 / 放电过流 / MOS 高温 / 电量低……；
            没有名字的高位单列成「未定义位 · 位 N」，灰色显示，不再算告警。
            面板底部还给出保护 / 告警 / 均衡三张位图的原始十六进制。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
