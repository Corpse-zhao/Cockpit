name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "E400Cockpit-v0.2.0.ipa" Payload
          ls -lh E400Cockpit-v0.2.0.ipa
          unzip -l E400Cockpit-v0.2.0.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: E400Cockpit-ipa
          path: E400Cockpit-v0.2.0.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: E400Cockpit v0.2.0
          body: |
            凌博 E400 蓝牙仪表 v0.2.0

            - BLE 直连（FFF0 / FFF1 / FFF2）
            - 凌博协议 AA55 解析（标定握手 + 实时帧）
            - 仪表页 / 数据台（原始帧监视）/ 设置（轮周长标定）

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: E400Cockpit-v0.2.0.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
