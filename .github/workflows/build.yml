name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cockpit.xcodeproj \
            -scheme Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **新增远驱（Fardriver / VOTOL）控制器支持**

            - 远驱走 FFE0 / FFEC 纯通知通道，**不发请求帧**，连上就等它推
            - 帧：固定 16 字节 `AA | id | 12B 数据 | CRC16`，校验初值 0x7F3C（与凌博不同）
            - 字段：0xE2 转速+档位、0xE8 电压+电流（负值=回充）、0xD6 控制器温、0xF4 电机温+SOC
            - 转速按 `rawRpm × 4 ÷ 极对数`（默认 20），车速沿用原来的公式，不另起一套
            - **连上后按首帧自动识别**：16 字节 + 0xAA + 校验通过才切成远驱，
              凌博一旦标定成功就锁死，不会误切——两边插着也能各自认

            **凌博链路零改动**：驱动接口、订阅/轮询、仪表页、数据台均未改逻辑，
            只把「必须有写通道」放宽成「有通知通道就够」，并在写通道缺失时跳过写入。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
