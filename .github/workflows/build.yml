name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **仪表样式收敛成两套：霓虹（默认）+ 红黑**

            赛道 / 液态 / 示波 / 轨道四套删掉了——同一份数据做四套近似画法，维护成本高、
            实际只会用一套，不如把留下的两套打磨到位：

            - 霓虹：圆盘 + 发光进度弧，可叠壁纸，主题色可换（默认）
            - 红黑：斜梯 + 巨字 + 全景特效，固定血红配色，不叠壁纸

            **新增：红黑全景 HUD（照参考片 1:1 复刻）**

            顶栏车名 + 已连接/保护板徽标 + 信号条 + 紫条；左边 34 段电池环（SOC / 剩余 Ah / 压差）；
            中间斜梯 26 根横档跟着车速点亮，红区在顶端；175pt 巨字车速（斜切 + 横向压缩）；
            右边动力输出环（kW / 母线 / 相线）与温度双弧；底部相线电流 / 纵向 G / 转速；
            底栏骑行时间 / 本次里程 / 电池功率；右下四个入口（仪表 / 设备 / 记录 / 设置）都能点。

            **加速冲击：用真实加速度驱动，不是播动画**

            对车速做差分得到瞬时加速度（km/h/s），30 以上算满格，然后指数衰减 0.2 秒：

            - 整屏抖：水平 7.2px + 竖直 5.2px 的正弦，叠加每帧随机抖动
            - 画面轻微推近 3.4%
            - 车速数字放大、红/青重影拉开、上下两片反向错位（撕裂）
            - 白光闪一下、红光铺满、从数字背后拉出横向光带
            - 两圈冲击波扩散到 700px、14 根放射粒子、两条红色扫描线滚过
            - 斜梯整条泛白、残影线被拉成激光

            **车名**取设置页「车型」里填的字，改完回仪表立刻生效。

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
