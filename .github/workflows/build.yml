name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **修：电池页「告警 有」误报**

            以前只判断「告警位图是不是 0」——蚂蚁协议只定义了 bit0–15，高位不同固件写法不一样，
            有的板子会往里塞状态位，于是官方小程序看着一切正常、我们却报「有告警」。
            现在按位翻译成中文条目：

            - 单体过压告警 / 单体欠压告警 / 总压过压 / 总压欠压 / 充电过流 / 放电过流
            - 充电高温 / 放电高温 / 充电低温 / 放电低温 / 环境高温 / 环境低温 / MOS 高温 / 电量低
            - 没有名字的高位单独列成「未定义位 · 位 N」，用灰色显示，不再算告警
            - 面板底部给出保护 / 告警 / 均衡三张位图的原始十六进制，方便对协议

            **新增：链路自检（电池详情页）**

            - 「刷新 N 帧 / 最后一帧 x.x 秒前 / 帧长 x 字节」，超过 3 秒没有新帧会变橙
            - 数值看着「不动」时先看这里：帧数在涨说明板子一直在回，
              停着的车电量、总压、单体电压本来就只在毫伏级抖
            - 顺手改了写入策略：超过 2.5 秒没新帧时改用「要响应」的写，
              有的模块在没有响应的写队列里卡住后会静默丢包，带响应的写能把它拽回来

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
