name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **真的铺满全屏了**

            - 之前背景是跟内容一起按安全区排的。横屏底下有标签栏 + Home 条约 50pt，
              那一块没人画，就露出纯黑——整块画面看着像一张浮在屏幕中间的黑卡片。
            - 现在背景单独一层，放在 background 里再 ignoresSafeArea，
              一路画到标签栏和 Home 条后面；内容仍按安全区排版，不会被底栏压住数据。
            - 标签栏背景改成透明，不再糊一条黑带在画面上。

            **承上一版**
            - 粉黑中间那组（立绘 / 车速 / 电量续航）跟着画布宽居中，不再左偏
            - 红黑：斜梯 + 大字 + 雷达整组 1.15 放大并下移；大数字从圆体换成
              SF Pro 重体斜体（圆体的 0 右边本来就近乎垂直）

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
