name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

# 新仓库的 GITHUB_TOKEN 默认只读，不显式给 write 会 403 建不了 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号只维护在 project.yml 一处，工作流自动跟随，避免忘记改 tag
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project E400Cockpit.xcodeproj \
            -scheme E400Cockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign + package IPA
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "E400Cockpit.app" | head -1)
          echo "APP=$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Cockpit-v${V}.ipa" Payload
          ls -lh "Cockpit-v${V}.ipa"
          unzip -l "Cockpit-v${V}.ipa" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-ipa
          path: Cockpit-v${{ steps.ver.outputs.version }}.ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cockpit v${{ steps.ver.outputs.version }}
          body: |
            凌博 E400 蓝牙仪表 v${{ steps.ver.outputs.version }}

            **修：整块内容没铺满屏幕（四周黑边）**

            - 根因：设计稿缩放用了 `.scaleEffect` 的**中心锚点**，而缩放前画布比屏幕宽，
              布局按宽画布算、画完再以中心缩回去，整块内容就被推到中间偏右下，
              左右各让出一条黑边；横屏的安全区又没人吃掉，二次挤压。
            - 现在缩放统一走 `FullBleedCanvas`：只按高度定比例、宽度反推（画布永远够宽），
              锚点钉在左上角，最外层再套一个刚好等于屏幕大小的框并裁掉溢出。
              霓虹 / 红黑 / 粉黑三套一起生效，横屏不再有黑边。

            **修：红黑仪表那个「0」看着别扭**

            - 175pt 的大字被横向压到 0.74，三个数字刚好，但单个「0」会压成一根细长椭圆。
              现在压缩比跟着位数走：一位数不压、两位 0.92、三位 0.80。
            - 「待机 / km/h」原来没和大字同轴，偏在右边；现在钉死 330 宽居中，
              和大字一条竖中轴。

            **粉黑仪表（上一版）**
            - 中间放车图，垫在所有数据后面，不挡读数；设置里可从相册换图
            - 左上时间、右上天气（Open-Meteo，真实数据），右侧车速 + 电压/功率，
              左下控制器信息，底栏电量 + 预估续航（剩余 Ah × 1.5km）

            ad-hoc 签名，越狱设备经 TrollStore / AppSync / Sideloadly 安装。
          files: Cockpit-v${{ steps.ver.outputs.version }}.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
