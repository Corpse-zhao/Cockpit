name: E400Cockpit
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  E400Cockpit:
    type: application
    platform: iOS
    sources:
      - path: E400Cockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.e400cockpit
        MARKETING_VERSION: "0.4.6"
        CURRENT_PROJECT_VERSION: "20"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
    info:
      path: E400Cockpit/Info.plist
      properties:
        CFBundleDisplayName: Cockpit
        CFBundleName: Cockpit
        CFBundleShortVersionString: "0.4.6"
        CFBundleVersion: "20"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 通过蓝牙连接电动车辆控制器，实时读取行驶数据。
        NSLocationWhenInUseUsageDescription: 使用 GPS 计算车速与里程，比轮速换算更准确。
schemes:
  E400Cockpit:
    build:
      targets:
        E400Cockpit: all
    archive:
      config: Release
