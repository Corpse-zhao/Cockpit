name: Cockpit
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Cockpit:
    type: application
    platform: iOS
    sources:
      - path: Cockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.e400cockpit
        MARKETING_VERSION: "0.5.14"
        CURRENT_PROJECT_VERSION: "39"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
    info:
      path: Cockpit/Info.plist
      properties:
        CFBundleDisplayName: Cockpit
        CFBundleName: Cockpit
        # 不要再写字面量：这两项必须跟着上面的构建设置走，
        # 否则包名是新的、应用内「关于」里还是旧版本（0.5.12 就是这样翻车的）
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 通过蓝牙连接电动车辆控制器，实时读取行驶数据。
        NSLocationWhenInUseUsageDescription: 使用 GPS 计算车速与里程，比轮速换算更准确。
schemes:
  Cockpit:
    build:
      targets:
        Cockpit: all
    archive:
      config: Release
